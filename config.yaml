# Configuration for Thermally Coupled Reactor (TCR) Simulation & Optimization
# Every physical parameter includes an explicit 'source' citation.
# Model provenance summary:
# - Tube methanol kinetics (production): Vanden Bussche & Froment (1996), eta_exo = 0.35.
# - Tube methanol kinetics (benchmark): Authentic Graaf et al. (1988), correcting printed
#   Khademi et al. (2009) Table 1 typographical errors (k1 E_a: 63,000 vs 113,000 J/mol;
#   RWGS pre-exponential: 9.64e6 vs 9.64e11).
# - Shell cyclohexane dehydrogenation: NIST Chemistry WebBook standard entropies
#   (DELTA_S_R_298 = 362.96 J/(mol*K), van 't Hoff slope -dH_r/R = -24,704 K, correcting
#   Khademi et al. 2009 Table 4 erroneous Kp exponent +3190 K / -3190 K) paired with
#   Itoh (1987) and Khademi et al. (2009) rate and benzene adsorption parameters.
# - Transport & hydraulics: Dixon (1997) / Li & Finlayson (1977) wall heat transfer,
#   unified dynamic Bauer-Schluender effective radial conductivity k_er,
#   Wassiljewa-Mason-Saxena gas mixture thermal conductivity, and Ergun (1952) /
#   Eisfeld-Schnitzlein (2001) packed-bed pressure drop.

geometry:
  L:
    value: 7.022
    unit: "m"
    source: "Khademi et al. (2009), Table 7 (exothermic methanol synthesis tube length)"
  D_in:
    value: 0.038
    unit: "m"
    source: "Khademi et al. (2009), Table 7 (tube inner diameter)"
  D_out:
    value: 0.042
    unit: "m"
    source: "Khademi et al. (2009), Table 7 (tube outer diameter)"
  p_t:
    value: 0.05523
    unit: "m"
    source: "Triangular pitch unit-cell method (pt/D_out = 1.315, Khademi et al. 2009 Fig. 1)"
  D_shell_eff:
    value: 0.058
    unit: "m"
    source: "Triangular-pitch production unit-cell effective shell diameter (pt * sqrt(2*sqrt(3)/pi)); benchmark overrides to Khademi et al. (2009) Table 8 exact 0.060 m"
  N_tubes:
    value: 2962
    unit: "-"
    source: "Industrial Lurgi methanol reactor tube bundle (Khademi et al. 2009; Rahimpour et al. 2008)"
  Kw:
    value: 48.0
    unit: "W/(m·K)"
    source: "Khademi et al. (2009), Table 7; Incropera & DeWitt (2007), carbon steel tube wall"

catalyst:
  tube:
    # Methanol synthesis (CuO/ZnO/Al2O3):
    # Production uses Vanden Bussche & Froment (1996) with eta = 0.35;
    # Khademi benchmark uses authentic Graaf et al. (1988) kinetics (correcting Khademi Table 1 typos).
    dp:
      value: 0.00547
      unit: "m"
      source: "Khademi et al. (2009), Table 7"
    rho_b:
      value: 1140.0
      unit: "kg/m^3"
      source: "Khademi et al. (2009), Table 7"
    eps:
      value: 0.39
      unit: "-"
      source: "Khademi et al. (2009), Table 7"
    eta:
      value: 0.35
      unit: "-"
      source: "Vanden Bussche & Froment (1996); Froment, Bischoff & De Wilde (2011) baseline effectiveness factor for 5.47 mm commercial Cu/ZnO/Al2O3 pellets (benchmark uses authentic Graaf 1988 at eta = 1.0)"
  shell:
    # Cyclohexane dehydrogenation (Pt/Al2O3):
    # Equilibrium Kp from NIST Chemistry WebBook S_298 (DELTA_S_R_298 = 362.96 J/(mol*K),
    # van 't Hoff slope ~ -24,704 K, correcting Khademi Table 4 erroneous Kp exponent);
    # Rate and benzene adsorption parameters from Itoh (1987) & Khademi et al. (2009) Table 4.
    dp:
      value: 0.00355
      unit: "m"
      source: "Khademi et al. (2009), Table 8 (Markatos et al.)"
    rho_b:
      value: 1077.0
      unit: "kg/m^3"
      source: "Pt/Al2O3 packed-bed catalyst bulk density (Itoh 1987; Khademi et al. 2009)"
    eps:
      value: 0.40
      unit: "-"
      source: "Production Pt/Al2O3 shell bed void fraction (benchmark overrides to Khademi et al. 2009 Table 8 exact 0.39)"
    eta:
      value: 1.0
      unit: "-"
      source: "Itoh (1987) & Khademi et al. (2009) shell Pt/Al2O3 baseline effectiveness factor"

feed:
  production:
    tube:
      # Components: [H2, CO2, CO, CH3OH, H2O, CH4, N2]
      y0: [0.6590, 0.0940, 0.0460, 0.0050, 0.0004, 0.1026, 0.0930]
      T0:
        value: 503.15
        unit: "K"
        source: "Khademi et al. (2009), Table 7 / industrial Lurgi methanol feed temperature"
      P0:
        value: 76.98e5
        unit: "Pa"
        source: "Khademi et al. (2009), Table 7"
      F_total0:
        value: 0.640
        unit: "mol/s"
        source: "Khademi et al. (2009), Table 7 (locked strictly at 0.640 mol/s across all baseline and optimized reactors for equal-throughput comparison)"
    shell:
      # Components: [C6H12, C6H6, H2, Ar] (4-component shell mixture supporting Ar diluent and 5% H2 co-feed)
      y0: [0.95, 0.0, 0.05, 0.0]
      components: ["C6H12", "C6H6", "H2", "Ar"]
      T0:
        value: 485.0
        unit: "K"
        source: "Production shell feed with 5 mol% H2 co-feed preventing Pt/Al2O3 coking and eliminating microscopic reversibility rate singularity"
      P0:
        value: 2.5e5
        unit: "Pa"
        source: "Elevated baseline inlet pressure (2.5 bar) ensuring positive shell effluent discharge pressure (>= 1.10 bar) across all modes"
      F_total0:
        value: 0.040
        unit: "mol/s"
        source: "Balanced thermal capacity matching exothermic tube heat release per tube"

  benchmark_khademi:
    tube:
      y0: [0.6590, 0.0940, 0.0460, 0.0050, 0.0004, 0.1026, 0.0930]
      T0:
        value: 527.8
        unit: "K"
        source: "Khademi et al. (2009), Table 9 (DE-optimized OTCR tube inlet temperature; CMR benchmark uses 503.15 K)"
      P0:
        value: 76.98e5
        unit: "Pa"
        source: "Khademi et al. (2009), Table 7"
      F_total0:
        value: 0.640
        unit: "mol/s"
        source: "Khademi et al. (2009), Table 7 (locked strictly at 0.640 mol/s across all benchmark and production reactors)"
    shell:
      # Components: [C6H12, C6H6, H2, Ar]
      y0: [0.10, 0.0, 0.0, 0.90]
      T0:
        value: 423.0
        unit: "K"
        source: "Khademi et al. (2009), Table 9 (DE-optimized OTCR shell inlet temperature)"
      P0:
        value: 1.01325e5
        unit: "Pa"
        source: "Khademi et al. (2009), Table 8 (Kusakabe et al. atmospheric shell inlet pressure)"
      F_total0:
        value: 0.111
        unit: "mol/s"
        source: "Khademi et al. (2009), Table 9 (DE-optimized OTCR shell molar flow rate)"

transport:
  conventional:
    h_cool:
      value: 6000.0
      unit: "W/(m^2·K)"
      source: "Perry's Chemical Engineers' Handbook, Section 5; boiling water jacket film coefficient"
    T_coolant:
      value: 503.15
      unit: "K"
      source: "Industrial Lurgi commercial boiling-water reactor baseline coolant temperature"
  wall_heat_transfer:
    correlation: "Dixon_Li_Finlayson"
    source: "Dixon (1997) & Li & Finlayson (1977) wall heat transfer; unified dynamic Bauer-Schluender k_er; Wassiljewa-Mason-Saxena mixture conductivity; Ergun (1952) & Eisfeld-Schnitzlein (2001) pressure drop"
    Kg_exo: 0.12
    Kg_endo: 0.04
    mu_exo: 1.8e-5
    mu_endo: 1.2e-5

solver:
  z_points: 300
  rtol: 1.0e-7
  atol: 1.0e-9
  picard_max_iter: 300
  picard_tol_T: 1.0e-3
  picard_tol_F: 1.0e-6
  picard_alpha: 0.70

optimization:
  seed: 42
  seeds: [42, 101, 777]
  pop_size: 36
  n_gen: 20
  pop_size_counter: 16
  n_gen_counter: 10
  bounds:
    T_exo_0: [490.0, 530.0]
    T_endo_0: [460.0, 510.0]
    F_endo_0: [0.025, 0.080]
    P_endo_0: [2.0e5, 3.0e5]
  T_max_limit: 535.0
  P_shell_out_min: 1.10
  P_shell_out_knee: 1.15

use_real_gas_eos: false  # All primary ideal-gas/fixed-eta runs use false (matching solver defaults); run_otp_and_eos_audit explicitly enables use_real_gas_eos=True for the PR-EOS comparison
use_dynamic_thiele: false  # Primary runs lock fixed pellet eta_exo=0.35; dynamic Thiele diagnostics are evaluated separately in benchmark thiele_analysis


